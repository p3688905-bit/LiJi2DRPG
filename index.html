<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>李寄斬蛇 - 搜神記經典RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ==================== 【強制重置所有樣式，避免衝突】 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overscroll-behavior-y: contain;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #0f172a !important;
        }
        
        /* ==================== 【絕對正確的地圖容器樣式】 ==================== */
        #scene-explore {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-color: #000 !important;
            z-index: 10 !important;
        }
        
        #map-grid {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            display: grid !important;
            grid-template-columns: repeat(10, 1fr) !important;
            grid-template-rows: repeat(10, 1fr) !important;
            z-index: 1 !important;
            background-color: #1e293b !important;
        }
        
        #entity-layer {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            pointer-events: none !important;
            z-index: 2 !important;
        }
        
        /* ==================== 【修復對話框立繪顯示】 ==================== */
        #dialogue-portrait {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            position: absolute !important;
            inset: 0 !important;
            z-index: 1 !important;
        }
        
        #dialogue-portrait-fallback {
            position: absolute !important;
            inset: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 2 !important;
        }
        
        /* ==================== 【關鍵：優化移動動畫，消除閃爍】 ==================== */
        .grid-entity {
            will-change: transform, left, top;
            transition: transform 0.15s linear, left 0.15s linear, top 0.15s linear;
        }
        
        /* ====================================================================== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .anim-shake { animation: shake 0.5s; }
        .anim-tackle { animation: tackle 0.3s ease-in-out; }
        @keyframes tackle {
            0% { transform: translateX(0); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(0); }
        }
        .anim-tackle-reverse { animation: tackleReverse 0.3s ease-in-out; }
        @keyframes tackleReverse {
            0% { transform: translateX(0); }
            50% { transform: translateX(-20px); }
            100% { transform: translateX(0); }
        }
        .cg-fade-in { animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4 font-serif text-slate-100">

    <div class="relative w-full max-w-[420px] aspect-square bg-black rounded-lg shadow-2xl overflow-hidden border-4 border-slate-800">
        
        <!-- 1. 標題畫面 -->
        <div id="scene-title" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center cursor-pointer" onclick="startIntro()">
            <h1 class="text-5xl font-bold text-amber-500 mb-4 tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">李寄斬蛇</h1>

            <div class="text-amber-600 animate-pulse text-sm font-mono mt-8">點擊畫面開始</div>
        </div>

        <!-- 2. 前導劇情畫面 -->
        <div id="scene-intro" class="hidden absolute inset-0 bg-black z-50 flex flex-col items-center justify-center p-8 text-center cursor-pointer" onclick="nextIntro()">

            <div class="absolute bottom-6 right-6 text-xs text-amber-500 animate-pulse font-mono">點擊繼續 ▼</div>
        </div>

        <!-- 3. 探索地圖畫面 -->
        <div id="scene-explore" class="hidden">
            <div id="map-header" class="absolute top-0 left-0 bg-black/80 text-amber-500 px-3 py-1 text-sm font-bold border-b border-r border-slate-700 rounded-br z-20 pointer-events-none tracking-widest"></div>
            
            <div id="hud-inventory" class="hidden absolute top-1 right-1 bg-black/80 text-slate-300 px-2 py-1 text-sm border border-slate-700 rounded z-20 pointer-events-none flex gap-2 items-center shadow-lg">
                <span class="text-xs text-amber-500">裝備:</span>
                <span id="inv-sword" class="opacity-30 grayscale transition-all duration-500 text-lg drop-shadow-md">🗡️</span>
                <span id="inv-dog" class="opacity-30 grayscale transition-all duration-500 text-lg drop-shadow-md">🐕</span>
                <span id="inv-bait" class="opacity-30 grayscale transition-all duration-500 text-lg drop-shadow-md">🍙</span>
            </div>
            
            <div id="map-grid"></div>
            <div id="entity-layer"></div>
        </div>

        <!-- 4. 對話框 (附帶角色立繪支援) -->
        <div id="scene-dialogue" class="hidden absolute bottom-2 left-2 right-2 bg-slate-900/95 border-2 border-amber-600/80 p-3 rounded z-40 cursor-pointer shadow-2xl" onclick="nextDialogue()">
            <div class="flex flex-row items-start gap-3">
                <div class="w-16 h-16 sm:w-20 sm:h-20 shrink-0 border-2 border-slate-600 rounded bg-slate-800 overflow-hidden shadow-inner flex items-center justify-center text-4xl relative">
                    <img id="dialogue-portrait" src="" class="hidden w-full h-full object-cover absolute inset-0">
                    <span id="dialogue-portrait-fallback"></span>
                </div>
                <div class="flex-1 min-h-[4.5rem] relative pb-4">
                    <div id="dialogue-speaker" class="font-bold text-amber-400 mb-1 text-base sm:text-lg border-b border-slate-700 pb-1 inline-block"></div>
                    <div id="dialogue-text" class="text-sm sm:text-[15px] leading-relaxed text-slate-200"></div>
                    <div class="absolute bottom-0 right-1 text-xs text-amber-500 animate-pulse font-mono">繼續 ▼</div>
                </div>
            </div>
        </div>

        <!-- 5. CG 全螢幕插圖對話框 -->
        <div id="scene-cg" class="hidden absolute inset-0 bg-black z-50 flex flex-col cursor-pointer" onclick="nextDialogue()">

                <div id="cg-fallback-text" class="text-2xl font-bold tracking-widest text-white drop-shadow-md"></div>
            </div>
            <!-- 實際 CG 圖片 -->

            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent pointer-events-none"></div>
            <div class="absolute bottom-4 left-4 right-4 bg-black/60 border border-slate-500/50 p-4 rounded text-slate-200 backdrop-blur-sm shadow-2xl">
                <div id="cg-speaker" class="font-bold text-amber-400 mb-2 border-b border-slate-500/50 pb-1 inline-block drop-shadow-md"></div>
                <div id="cg-text" class="text-sm sm:text-[15px] leading-relaxed drop-shadow-md min-h-[3rem]"></div>
                <div class="absolute bottom-2 right-3 text-xs text-amber-500 animate-pulse font-mono">點擊繼續 ▼</div>
            </div>
        </div>

        <!-- 6. 戰鬥畫面 -->
        <div id="scene-combat" class="hidden absolute inset-0 bg-slate-900 z-50 flex flex-col font-mono select-none">
            <div id="combat-bg" class="relative flex-1 bg-slate-800 bg-cover bg-center overflow-hidden border-b-4 border-slate-800">
                <div class="absolute inset-0 bg-black/30"></div> 
                
                <div class="absolute top-4 right-4 flex flex-col items-end z-10 w-48">

                    </div>
                    <div id="anim-wrap-enemy" class="relative w-32 h-32 flex items-center justify-center text-8xl drop-shadow-xl translate-x-4">

                        <span id="sprite-enemy-fallback">🐍</span>

                </div>

                <div class="absolute bottom-4 left-4 flex flex-col items-start z-10 w-48">
                    <div class="flex items-end mb-2 translate-y-4 translate-x-4 relative">
                        <div id="anim-wrap-dog" class="relative w-16 h-16 flex items-end justify-center text-5xl drop-shadow-md -scale-x-100 left-4 z-0">
                            <img id="sprite-dog-img" src="" class="hidden w-full h-full object-contain absolute inset-0">
                            <span id="sprite-dog-fallback">🐕</span>
                        </div>

                        </div>
                    </div>
                    <div class="w-full bg-white border-4 border-slate-600 rounded-lg p-2 shadow-md relative z-20">

                        <div class="w-full bg-slate-300 h-2 rounded-full overflow-hidden border border-slate-400 mb-1">
                            <div id="player-hp-bar" class="bg-green-500 h-full transition-all duration-300 w-full origin-left"></div>
                        </div>
                        <div id="player-hp-text" class="text-xs text-right text-slate-600 font-bold">100 / 100</div>
                    </div>
                </div>
            </div>

            <div class="h-32 bg-white relative cursor-pointer" onclick="advanceCombatDialogue()">

                    <span id="combat-text">大蛇出現了！</span>
                    <div id="combat-arrow" class="absolute bottom-2 right-3 text-red-500 animate-bounce hidden">▼</div>
                </div>
                <div id="combat-menu" class="hidden absolute top-0 right-0 h-full w-[60%] sm:w-1/2 bg-white border-l-4 border-slate-800 p-2 z-20">
                    <div class="grid grid-cols-2 gap-2 h-full text-slate-800 font-bold text-xs sm:text-sm">
                        <button onclick="combatAction('attack'); event.stopPropagation();" class="border-2 border-slate-400 rounded hover:bg-slate-200 active:bg-slate-300 shadow-sm">🗡️ 越國古劍</button>
                        <button onclick="combatAction('dog'); event.stopPropagation();" class="border-2 border-slate-400 rounded hover:bg-slate-200 active:bg-slate-300 shadow-sm">🐕 放犬咋齧</button>

                        <button onclick="combatAction('flee'); event.stopPropagation();" class="border-2 border-slate-400 rounded hover:bg-slate-200 active:bg-slate-300 shadow-sm text-slate-400">逃跑</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 7. 結局畫面 -->
        <div id="scene-end" class="hidden absolute inset-0 bg-black z-50 flex flex-col items-center justify-start pt-12 px-6 text-center overflow-y-auto">
            <div class="text-5xl mb-4">📜</div>
            <h1 class="text-3xl font-bold text-amber-500 mb-6 drop-shadow-md tracking-widest border-b border-amber-800 pb-4">搜神記·完</h1>
            <div class="text-slate-300 text-sm leading-loose text-left w-full space-y-4">
                <p>李寄成為越王后，父親亦被拜為將相。母親與姊姊們皆獲得豐厚的賞賜，李家從此脫離貧困。</p>
                <p>從此，東冶一帶再也沒有妖邪之物作祟。</p>
                <p>關於這位勇敢少女帶著獵犬與寶劍，挺身而出為民除害的歌謠，至今仍在東越的民間傳唱不休...</p>
                <p class="text-center text-amber-600 pt-8 font-bold text-lg">感謝您的遊玩！</p>
            </div>
            <button onclick="resetToTitle()" class="mt-10 mb-8 bg-slate-800 hover:bg-slate-700 text-amber-500 py-3 px-8 rounded border border-amber-900/50 active:scale-95 transition-all tracking-widest">
                返回卷首
            </button>
        </div>

    </div>

    <!-- 虛擬控制器 -->

            <div></div>
            <button class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl active:bg-slate-500 text-xl border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all" onclick="tryMove(0, -1)">⬆️</button>
            <div></div>
            <button class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl active:bg-slate-500 text-xl border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all" onclick="tryMove(-1, 0)">⬅️</button>
            <button class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl active:bg-slate-500 text-xl border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all" onclick="tryMove(0, 1)">⬇️</button>

                const textEl = document.getElementById(id + '-fallback');
                if (imgUrl && imgUrl.trim() !== '') {
                    imgEl.src = imgUrl; 
                    imgEl.classList.remove('hidden'); 
                    textEl.classList.add('hidden');
                    // ★ 容錯機制：若戰鬥圖片死連結，自動切換 Emoji
                    imgEl.onerror = function() {
                        this.classList.add('hidden');
                        textEl.classList.remove('hidden');
                        textEl.innerText = fallbackText;
                    };
                } else {
                    imgEl.classList.add('hidden'); 
                    textEl.classList.remove('hidden'); 
                    textEl.innerText = fallbackText;
                }
            };
            setCombatSprite('sprite-enemy', CUSTOM_IMAGES.combat_enemy, EMOJI_FALLBACK.combat_enemy);

        function renderMap() {
            const mapData = MAPS[currentMap];
            document.getElementById('map-header').innerText = mapData.name;
            const grid = document.getElementById('map-grid');
            const entityLayer = document.getElementById('entity-layer');
            
            // 強制清空
            grid.innerHTML = '';
            entityLayer.innerHTML = '';
            
            // 重置元素引用
            playerElement = null;
            dogElement = null;

            const dynamicSprites = mapData.getDynamicTriggerSprites ? mapData.getDynamicTriggerSprites() : {};
            const triggerSprites = { ...(mapData.triggerSprites || {}), ...dynamicSprites };

            // 渲染網格
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    const isWall = mapData.grid[y][x] === 1;
                    const isDoor = mapData.grid[y][x] === 2;

                    let bgImg = isWall ? mapData.bg_wall : mapData.bg_floor;
                    let bgColor = isWall ? mapData.color_wall : mapData.color_floor;
                    
                    // ★ 強制設置樣式，不依賴Tailwind
                    cell.style.position = 'relative';
                    cell.style.display = 'flex';
                    cell.style.alignItems = 'center';
                    cell.style.justifyContent = 'center';
                    cell.style.overflow = 'hidden';
                    cell.style.border = '1px solid rgba(0,0,0,0.1)';
                    cell.style.backgroundColor = bgColor;
                    
                    if (bgImg && bgImg.trim() !== '') {
                        cell.style.backgroundImage = `url('${bgImg}')`;
                        cell.style.backgroundSize = 'cover';
                        cell.style.backgroundPosition = 'center';
                        cell.style.backgroundRepeat = 'no-repeat';
                    } else {
                        if (isWall && mapData.wall_emoji) {
                            cell.innerHTML = `<div style="font-size: 1.25rem; opacity: 0.6;">${mapData.wall_emoji}</div>`;
                        }
                    }
                    
                    if (isDoor) {
                        const overlay = document.createElement('div');
                        overlay.style.position = 'absolute';
                        overlay.style.inset = '0';
                        overlay.style.backgroundColor = 'rgba(0,0,0,0.6)';
                        overlay.style.pointerEvents = 'none';
                        cell.appendChild(overlay);
                    }
                    
                    grid.appendChild(cell);
                }
            }

            // 渲染所有靜態實體（NPC/裝飾）
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const entity = mapData.entities[`${x},${y}`];
                    const tsKey = triggerSprites[`${x},${y}`];
                    if (entity) {
                        createEntity(entityLayer, x, y, CUSTOM_IMAGES[entity.imgKey], EMOJI_FALLBACK[entity.imgKey], 'drop-shadow-md', false);
                    } else if (tsKey) {
                        createEntity(entityLayer, x, y, CUSTOM_IMAGES[tsKey], EMOJI_FALLBACK[tsKey], 'drop-shadow-[0_0_8px_rgba(0,0,0,1)] scale-75', false);
                    }
                }
            }

            // 渲染玩家和狗（初始加載時）
            createPlayerAndDog();
        }

        // ==================== 【創建玩家和狗元素（只在切換地圖時調用）】 ====================
        function createPlayerAndDog() {
            const entityLayer = document.getElementById('entity-layer');
            
            // 渲染狗
            if (inventory.dog && progress < 5) { 
                let transform = prevPlayerState.facing === 'LEFT' ? 'scaleX(-1)' : '';
                dogElement = createEntity(entityLayer, prevPlayerState.x, prevPlayerState.y, CUSTOM_IMAGES.sprite_dog, EMOJI_FALLBACK.sprite_dog, 'drop-shadow-md scale-75', true, transform);
                dogElement.classList.add('dog-entity');
            }

            // 渲染玩家
            let playerTransform = player.facing === 'LEFT' ? 'scaleX(-1)' : '';
            playerElement = createEntity(entityLayer, player.x, player.y, CUSTOM_IMAGES.sprite_player, EMOJI_FALLBACK.sprite_player, 'drop-shadow-md z-10', true, playerTransform);
            playerElement.classList.add('player-entity');
        }

        function createEntity(container, x, y, imgUrl, fallbackText, extraClass, isAnimated, transform = '') {
            const hasImage = imgUrl && imgUrl.trim() !== '';
            const el = document.createElement(hasImage ? 'img' : 'div');
            
            // ★ 強制設置位置和大小
            el.style.position = 'absolute';
            el.style.left = `${x * 10}%`;
            el.style.top = `${y * 10}%`;
            el.style.width = '10%';
            el.style.height = '10%';
            el.style.pointerEvents = 'none';
            
            if (hasImage) {
                el.src = imgUrl;
                el.style.objectFit = 'contain';
                el.style.transform = transform;
                if (isAnimated) el.classList.add('grid-entity');
                // ★ 容錯機制：地圖角色圖片失效時轉為 Emoji
                el.onerror = function() {
                    this.outerHTML = `<div class="${extraClass} grid-entity" style="position:absolute; left:${this.style.left}; top:${this.style.top}; width:10%; height:10%; display:flex; align-items:center; justify-content:center; font-size:1.875rem; pointer-events:none; transform:${transform}"><div style="transform: ${transform}">${fallbackText}</div></div>`;
                };
            } else {
                el.innerHTML = `<div style="transform: ${transform}">${fallbackText}</div>`;
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.fontSize = '1.875rem';
                if (isAnimated) el.classList.add('grid-entity');
            }
            
            // 添加額外的class
            if (extraClass) {
                el.className = extraClass;
            }
            
            container.appendChild(el);
            return el;
        }

        // ==================== 【核心：只更新位置，不刪除重建元素】 ====================
        function updatePlayerAndDogPosition() {
            // 更新玩家位置和朝向
            if (playerElement) {
                playerElement.style.left = `${player.x * 10}%`;
                playerElement.style.top = `${player.y * 10}%`;
                let playerTransform = player.facing === 'LEFT' ? 'scaleX(-1)' : '';
                playerElement.style.transform = playerTransform;
            }
            
            // 更新狗的位置和朝向
            if (dogElement && inventory.dog && progress < 5) {
                dogElement.style.left = `${prevPlayerState.x * 10}%`;
                dogElement.style.top = `${prevPlayerState.y * 10}%`;
                let dogTransform = prevPlayerState.facing === 'LEFT' ? 'scaleX(-1)' : '';
                dogElement.style.transform = dogTransform;
            }
        }

        // ==================== 【優化：移動時只更新位置，不重新渲染任何東西】 ====================
        function tryMove(dx, dy) {
            if (gameState !== 'EXPLORE' || isMoving) return;

            let newFacing = player.facing;
            if (dx > 0) newFacing = 'RIGHT';
            if (dx < 0) newFacing = 'LEFT';
            if (dy > 0) newFacing = 'DOWN';
            if (dy < 0) newFacing = 'UP';

            // 只改變朝向，不移動
            if (player.facing !== newFacing && dx === 0 && dy === 0) {
                 player.facing = newFacing;
                 updatePlayerAndDogPosition(); // 只更新朝向
                 return;
            }
            player.facing = newFacing;

            let newX = player.x + dx;
            let newY = player.y + dy;
            const mapData = MAPS[currentMap];

            // 邊界檢查
            if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) { 
                updatePlayerAndDogPosition(); 
                return; 
            }
            // 牆壁和NPC檢查
            if (mapData.grid[newY][newX] === 1 || mapData.entities[`${newX},${newY}`]) { 
                updatePlayerAndDogPosition(); 
                return; 
            }

            // 觸發器檢查
            const trigger = mapData.triggers[`${newX},${newY}`];
            if (trigger) {
                if (trigger.type === 'exit') {
                    if (currentMap === 'home' && progress < 1) { 
                        startDialogue([{ s: '系統', t: '尚未辭行，不能離開。' }]); 
                        return; 
                    }
                    if (currentMap === 'village' && trigger.target === 'forest' && progress < 2) { 
                        startDialogue([{ s: '系統', t: '野獸出沒，無許可不得出城。' }]); 
                        return; 
                    }
                    if (currentMap === 'forest' && trigger.target === 'mountain' && progress < 3) { 
                        startDialogue([{ s: '系統', t: '裝備未齊且未覆命，不可進山。' }]); 
                        return; 
                    }
                    
                    // 切換地圖時才重新渲染整個地圖
                    currentMap = trigger.target;
                    player.x = trigger.x;
                    player.y = trigger.y;
                    prevPlayerState = { ...player }; 
                    renderMap();
                    return;
                } else if (trigger.type === 'event' && trigger.id === 'snake_cave') {
                    if (progress === 3) startDialogue(DIALOGUES.cave_0);
                    else if (progress === 4) {
                        currentMap = 'cave';
                        player.x = 4; player.y = 8;
                        prevPlayerState = { ...player }; 
                        renderMap();
                    }
                    return;
                } else if (trigger.type === 'event' && trigger.id === 'skulls') {
                    if (progress === 4) startDialogue(DIALOGUES.skulls_found);
                    return;
                }
            }
            
            // 正常移動
            isMoving = true;
            prevPlayerState = { x: player.x, y: player.y, facing: player.facing };
            player.x = newX;
            player.y = newY;
            
            // ★ 關鍵：只更新CSS屬性，不刪除重建任何元素
            updatePlayerAndDogPosition();
            
            setTimeout(() => { isMoving = false; }, 150); 
        }

        function interact() {
            if (gameState === 'DIALOGUE' || gameState === 'CG') { nextDialogue(); return; }
            if (gameState !== 'EXPLORE') return;

            let tx = player.x, ty = player.y;
            if (player.facing === 'UP') ty--;
            if (player.facing === 'DOWN') ty++;
            if (player.facing === 'LEFT') tx--;
            if (player.facing === 'RIGHT') tx++;

            const mapData = MAPS[currentMap];
            const entity = mapData.entities[`${tx},${ty}`];

            if (entity && entity.type === 'npc') {
                if (entity.id === 'parents') {
                    startDialogue(progress === 0 ? DIALOGUES.parents_0 : [{ s: '父母', t: '寄兒啊... 神明保佑妳平安歸來...' }]);
                } else if (entity.id === 'official') {
                    if (progress === 1) startDialogue(DIALOGUES.official_0);
                    else if (progress === 2) {
                        if (inventory.sword && inventory.dog && inventory.bait) startDialogue(DIALOGUES.official_complete);
                        else startDialogue(DIALOGUES.official_waiting);
                    } else if (progress >= 3) { startDialogue([{ s: '官吏', t: '庸嶺就在城南林地後方，快去吧！' }]); }
                } else if (entity.id === 'blacksmith') {
                    if (progress < 1) startDialogue([{ s: '鐵匠', t: '小娃兒別靠近火爐，危險！' }]);
                    else if (!inventory.sword) startDialogue(DIALOGUES.blacksmith_0);
                    else startDialogue(DIALOGUES.blacksmith_1);
                } else if (entity.id === 'baker') {
                    if (progress < 1) startDialogue([{ s: '米嫗', t: '這新米可香了...' }]);
                    else if (!inventory.bait) startDialogue(DIALOGUES.baker_0);
                    else startDialogue(DIALOGUES.baker_1);
                } else if (entity.id === 'hunter') {
                    if (progress < 2) startDialogue([{ s: '獵戶', t: '汪汪！別靠近我的狗！' }]);
                    else if (!inventory.dog) startDialogue(DIALOGUES.hunter_0);
                    else startDialogue(DIALOGUES.hunter_1);
                } else if (entity.id === 'king') {
                    if (progress === 5) startDialogue(DIALOGUES.king_reward);
                } else if (entity.id === 'father_rich' || entity.id === 'mother_rich') {
                    startDialogue(DIALOGUES.parents_rich);
                }
            } else {
                const trigger = mapData.triggers[`${tx},${ty}`];
                if (trigger && trigger.type === 'event' && trigger.id === 'snake_cave') {
                    if (progress === 3) startDialogue(DIALOGUES.cave_0);
                } else if (trigger && trigger.type === 'event' && trigger.id === 'skulls') {
                    if (progress === 4) startDialogue(DIALOGUES.skulls_found);
                }
            }
        }

        // --- 對話與 CG 系統 ---
        function startDialogue(dialogueArray) {
            currentDialogues = dialogueArray;
            dialogueIndex = 0;
            updateDialogueUI();
        }

        // ==================== 【修復對話框立繪顯示】 ====================
        function updateDialogueUI() {
            const d = currentDialogues[dialogueIndex];
            
            if (d.cg) {
                setScene('CG');
                const cgImg = document.getElementById('cg-image');
                const cgFallback = document.getElementById('cg-fallback');
                const cgUrl = CUSTOM_IMAGES[d.cg];
                
                const showFallback = () => {
                    cgImg.classList.add('hidden');
                    cgFallback.classList.remove('hidden');
                    const fb = CG_FALLBACKS[d.cg];
                    cgFallback.className = `absolute inset-0 flex flex-col items-center justify-center opacity-40 transition-colors duration-500 ${fb.color}`;
                    document.getElementById('cg-fallback-emoji').innerText = fb.emoji;
                    document.getElementById('cg-fallback-text').innerText = fb.text;
                };

                if (cgUrl && cgUrl.trim() !== '') {
                    cgImg.src = cgUrl;
                    cgImg.classList.remove('hidden');
                    cgFallback.classList.add('hidden');
                    cgImg.classList.remove('cg-fade-in');
                    void cgImg.offsetWidth; 
                    cgImg.classList.add('cg-fade-in');
                    // ★ 容錯機制：CG圖失效時轉為意境色塊
                    cgImg.onerror = showFallback;
                } else {
                    showFallback();
                }

                document.getElementById('cg-speaker').innerText = d.s;
                document.getElementById('cg-text').innerHTML = d.t.replace(/\n/g, '<br/>');
            } else {
                setScene('DIALOGUE');
                document.getElementById('dialogue-speaker').innerText = d.s;
                document.getElementById('dialogue-text').innerHTML = d.t.replace(/\n/g, '<br/>');

                const portraitImg = document.getElementById('dialogue-portrait');
                const portraitFallback = document.getElementById('dialogue-portrait-fallback');
                const speakerId = SPEAKER_PORTRAIT_MAP[d.s] || 'system';
                const imgUrl = CUSTOM_IMAGES[`portrait_${speakerId}`];
                
                // 先隱藏兩個元素
                portraitImg.classList.add('hidden');
                portraitFallback.classList.add('hidden');
                
                const showPortraitFallback = () => {
                    portraitImg.classList.add('hidden');
                    portraitFallback.classList.remove('hidden');
                    portraitFallback.innerText = EMOJI_FALLBACK[`portrait_${speakerId}`] || EMOJI_FALLBACK.portrait_system;
                };

                if (imgUrl && imgUrl.trim() !== '') {
                    portraitImg.src = imgUrl;
                    portraitImg.classList.remove('hidden');
                    // ★ 強制顯示圖片
                    portraitImg.style.display = 'block !important';
                    // ★ 容錯機制：立繪圖片失效時轉為 Emoji
                    portraitImg.onerror = showPortraitFallback;
                } else {
                    showPortraitFallback();
                }
            }
        }

        function nextDialogue() {
            if (dialogueIndex < currentDialogues.length - 1) {
                dialogueIndex++;
                updateDialogueUI();
            } else {
                const eventName = currentDialogues[dialogueIndex].e;
                setScene('EXPLORE'); 
                handleEvent(eventName);
            }
        }

        function handleEvent(eventName) {
            if (!eventName) return;
            if (eventName === 'leave_home') progress = 1;
            if (eventName === 'start_quest') progress = 2; 
            if (eventName === 'get_sword') { inventory.sword = true; updateInventoryUI(); checkAllItems(); }
            if (eventName === 'get_dog') { 
                inventory.dog = true; updateInventoryUI(); 
                prevPlayerState = { ...player };
                // 獲得狗時重新創建元素
                createPlayerAndDog();
                checkAllItems(); 
            }
            if (eventName === 'get_bait') { inventory.bait = true; updateInventoryUI(); checkAllItems(); }
            if (eventName === 'unlock_mountain') progress = 3;
            if (eventName === 'open_cave') { 
                progress = 4; 
                renderMap(); // 切換地圖時重新渲染
            } 
            if (eventName === 'go_palace') { 
                progress = 5; 
                currentMap = 'palace';
                player.x = 4; player.y = 8; player.facing = 'UP';
                prevPlayerState = { ...player };
                renderMap(); // 切換地圖時重新渲染
                setScene('EXPLORE'); 
            }
            if (eventName === 'end_game') setScene('END');
            if (eventName === 'place_bait') startCombat();
        }

        function checkAllItems() {
            if (inventory.sword && inventory.dog && inventory.bait && progress === 2) {
                setTimeout(() => { startDialogue([{ s: '系統', t: '裝備與祭品皆已齊全，請向官吏覆命。' }]); }, 100);
            }
        }

        // --- 戰鬥系統 ---
        function updateHPUIs() {
            const getHPColor = (current, max) => {
                const ratio = current / max;
                if (ratio > 0.5) return 'bg-green-500';
                if (ratio > 0.2) return 'bg-yellow-400';
                return 'bg-red-500';
            };
            const pBar = document.getElementById('player-hp-bar');
            pBar.style.width = `${(combatState.playerHp / combatState.maxHp) * 100}%`;
            pBar.className = `h-full transition-all duration-300 w-full origin-left ${getHPColor(combatState.playerHp, combatState.maxHp)}`;
            document.getElementById('player-hp-text').innerText = `${combatState.playerHp} / ${combatState.maxHp}`;
            const eBar = document.getElementById('enemy-hp-bar');
            eBar.style.width = `${(combatState.enemyHp / combatState.enemyMaxHp) * 100}%`;
            eBar.className = `h-full transition-all duration-300 w-full origin-left ${getHPColor(combatState.enemyHp, combatState.enemyMaxHp)}`;
        }

        function queueCombatMsg(text, showMenuAfter = false) {
            combatState.msgQueue.push({ text, showMenuAfter });
        }

        function playAnimation(targetId, animClass) {
            const el = document.getElementById(targetId);
            el.classList.add(animClass);
            setTimeout(() => el.classList.remove(animClass), 500);
        }

        function advanceCombatDialogue() {
            if (combatState.msgQueue.length === 0) {
                if (combatState.enemyHp <= 0) {
                    startDialogue(DIALOGUES.snake_dead);
                } else if (combatState.playerHp <= 0) {
                    alert("李寄不幸犧牲，請重新來過。");
                    setScene('TITLE');
                }
                return;
            }

            const nextMsg = combatState.msgQueue.shift();
            document.getElementById('combat-text').innerText = nextMsg.text;
            
            if (nextMsg.showMenuAfter) {
                document.getElementById('combat-arrow').classList.add('hidden');
                document.getElementById('combat-menu').classList.remove('hidden');
            } else {
                document.getElementById('combat-arrow').classList.remove('hidden');
                document.getElementById('combat-menu').classList.add('hidden');
                if (combatState.msgQueue.length === 0) {
                    document.getElementById('combat-arrow').classList.add('hidden');
                }
            }
        }

        function startCombat() {
            combatState = {
                msgQueue: [], isProcessing: false,
                playerHp: 100, maxHp: 100,
                enemyHp: 200, enemyMaxHp: 200, 
                isPlayerDefending: false
            };
            updateHPUIs();
            setScene('COMBAT');
            document.getElementById('combat-menu').classList.add('hidden');
            document.getElementById('combat-arrow').classList.add('hidden');
            document.getElementById('combat-text').innerText = "頭大如囷的 庸嶺大蛇 出現了！";
            queueCombatMsg("大蛇正在貪婪地吞食蜜麨...", false);
            queueCombatMsg("去吧！咋蛇犬！", true);
        }

        function combatAction(action) {
            document.getElementById('combat-menu').classList.add('hidden');
            combatState.isPlayerDefending = false;

            if (action === 'flee') {
                document.getElementById('combat-text').innerText = "無法逃跑！百姓還在受苦！";
                queueCombatMsg("請選擇其他行動。", true);
                document.getElementById('combat-arrow').classList.add('hidden');
                return;
            }

            let dmg = 0;
            if (action === 'attack') {
                dmg = Math.floor(Math.random() * 21) + 30; 
                document.getElementById('combat-text').innerText = "李寄 使用了 拔劍斫斬！";
                playAnimation('anim-wrap-player', 'anim-tackle');
                setTimeout(() => playAnimation('anim-wrap-enemy', 'anim-shake'), 300);
            } else if (action === 'dog') {
                dmg = Math.floor(Math.random() * 16) + 40; 
                document.getElementById('combat-text').innerText = "咋蛇犬 使用了 放犬咋齧！";
                playAnimation('anim-wrap-dog', 'anim-tackle');
                setTimeout(() => playAnimation('anim-wrap-enemy', 'anim-shake'), 300);
            } else if (action === 'defend') {
                combatState.isPlayerDefending = true;
                document.getElementById('combat-text').innerText = "李寄 進入了 防禦狀態！";
            }

            setTimeout(() => {
                if (dmg > 0) {
                    combatState.enemyHp = Math.max(0, combatState.enemyHp - dmg);
                    updateHPUIs(); queueCombatMsg(`效果非常拔群！造成了 ${dmg} 點傷害！`);
                }
                
                if (combatState.enemyHp <= 0) {
                    queueCombatMsg("大蛇 倒下了！");
                    queueCombatMsg("戰鬥勝利！", false);
                    document.getElementById('combat-arrow').classList.remove('hidden');
                    return;
                }

                queueCombatMsg("大蛇 準備攻擊...", false);
                setTimeout(enemyTurn, 500); 
                document.getElementById('combat-arrow').classList.remove('hidden');
            }, 1000);
        }

        function enemyTurn() {
            combatState.msgQueue.push({ text: "大蛇因劇痛發狂，張開血盆大口撲來！", showMenuAfter: false });
            setTimeout(() => {
                playAnimation('anim-wrap-enemy', 'anim-tackle-reverse');
                setTimeout(() => playAnimation('anim-wrap-player', 'anim-shake'), 300);
                
                let enemyDmg = Math.floor(Math.random() * 11) + 5; 
                if (combatState.isPlayerDefending) {
                    enemyDmg = Math.floor(enemyDmg / 4); 
                    combatState.msgQueue.push({ text: "李寄 擋下了大部分的傷害！", showMenuAfter: false });
                }
                combatState.playerHp = Math.max(0, combatState.playerHp - enemyDmg);
                updateHPUIs();

                if (combatState.playerHp <= 0) {
                    combatState.msgQueue.push({ text: "李寄 倒下了..." });
                    combatState.msgQueue.push({ text: "眼前一片漆黑...", showMenuAfter: false });
                } else { 
                    combatState.msgQueue.push({ text: "李寄 該怎麼做？", showMenuAfter: true }); 
                }
            }, 100);
        }

        // --- 控制 ---
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            
            if (gameState === 'TITLE' && (e.key === ' ' || e.key === 'Enter')) startIntro();
            else if (gameState === 'INTRO' && (e.key === ' ' || e.key === 'Enter')) nextIntro();
            else if (gameState === 'EXPLORE') {
                switch (e.key) {
                    case 'ArrowUp': tryMove(0, -1); break;
                    case 'ArrowDown': tryMove(0, 1); break;
                    case 'ArrowLeft': tryMove(-1, 0); break;
                    case 'ArrowRight': tryMove(1, 0); break;
                    case ' ': case 'Enter': interact(); break;
                }
            } else if (gameState === 'DIALOGUE' || gameState === 'CG') {
                if (e.key === ' ' || e.key === 'Enter') nextDialogue();
            } else if (gameState === 'COMBAT') {
                if ((e.key === ' ' || e.key === 'Enter') && document.getElementById('combat-menu').classList.contains('hidden')) {
                    advanceCombatDialogue();
                }
            }
